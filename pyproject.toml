[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "tiancode"
version = "0.1.0"
description = "伴暖 WarmCompanion 家庭陪伴 API"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.110",
  "uvicorn[standard]>=0.29",
  "pydantic>=2",
  "pyjwt>=2.8.0",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.4"]

[tool.setuptools.packages.find]
where = ["backend"]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
pythonpath = ["backend"]

[tool.ruff]
line-length = 140
src = ["backend"]

[tool.ruff.lint]
# 只拦语法与明显错误。不在这次部署改动里全库重排 import。
select = ["E", "F"]
ignore = ["E501"]
