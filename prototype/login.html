<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>伴暖 (WarmCompanion) · 家庭温情认证中心</title>
  <style>
    :root {
      --bg-canvas: #FAF7F2;
      --card-bg: #FFFFFF;
      --text-main: #1C1917;
      --text-sub: #57534E;
      --text-muted: #78716C;
      --border-subtle: #E7E5E4;
      --border-focus: #C2410C;
      --accent: #C2410C;
      --accent-hover: #9A3412;
      --accent-soft: #FFF7ED;
      --kids-blue: #0284C7;
      --kids-soft: #E0F2FE;
      --success: #059669;
      --success-soft: #ECFDF5;
      --radius-card: 24px;
      --radius-btn: 28px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    body {
      background-color: var(--bg-canvas);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 16px;
      color: var(--text-main);
    }

    .auth-container {
      width: 100%;
      max-width: 440px;
      background: var(--card-bg);
      border-radius: var(--radius-card);
      border: 1px solid var(--border-subtle);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.06);
      padding: 28px 24px;
      display: flex;
      flex-direction: column;
      position: relative;
    }

    .brand-header {
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
      margin-bottom: 24px;
    }
    .brand-logo {
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, #C2410C 0%, #F97316 100%);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 28px;
      font-weight: 800;
      box-shadow: 0 8px 20px rgba(194, 65, 12, 0.25);
      margin-bottom: 12px;
    }
    .brand-title { font-size: 22px; font-weight: 800; color: var(--text-main); }
    .brand-sub { font-size: 13px; color: var(--text-muted); margin-top: 4px; }

    /* 通道模式主切换 (长辈/幼童极速通道 VS 守护者通道) */
    .role-nav {
      display: flex;
      background: #F5F5F4;
      border-radius: 14px;
      padding: 4px;
      margin-bottom: 20px;
    }
    .role-tab {
      flex: 1;
      padding: 10px;
      text-align: center;
      font-size: 14px;
      font-weight: 700;
      border-radius: 10px;
      cursor: pointer;
      border: none;
      background: transparent;
      color: var(--text-sub);
      transition: all 0.2s;
    }
    .role-tab.active {
      background: var(--card-bg);
      color: var(--accent);
      box-shadow: 0 2px 6px rgba(0, 0, 0, 0.06);
    }
    .role-tab.kids-tab.active { color: var(--kids-blue); }

    /* 守护者登录/注册二级切换 */
    .sub-switch {
      display: flex;
      justify-content: center;
      gap: 20px;
      margin-bottom: 20px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 10px;
    }
    .sub-btn {
      background: none;
      border: none;
      font-size: 15px;
      font-weight: 600;
      color: var(--text-muted);
      cursor: pointer;
      position: relative;
      padding-bottom: 8px;
    }
    .sub-btn.active {
      color: var(--accent);
      font-weight: 800;
    }
    .sub-btn.active::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 0; right: 0;
      height: 2px;
      background: var(--accent);
      border-radius: 2px;
    }

    /* 表单控件 */
    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 16px;
    }
    .form-label {
      font-size: 13px;
      font-weight: 700;
      color: var(--text-sub);
    }
    .input-wrap { position: relative; }
    input {
      width: 100%;
      height: 48px;
      border-radius: 14px;
      border: 1.5px solid var(--border-subtle);
      padding: 0 16px;
      font-size: 15px;
      outline: none;
      color: var(--text-main);
      background: #FAFAF9;
      transition: border-color 0.2s, box-shadow 0.2s;
    }
    input:focus {
      border-color: var(--border-focus);
      background: #FFF;
      box-shadow: 0 0 0 3px rgba(194, 65, 12, 0.15);
    }

    /* 极简大字 Pin 码专属输入框 */
    .elder-box {
      background: var(--accent-soft);
      border-radius: 18px;
      padding: 18px;
      border: 1px solid #FED7AA;
      margin-bottom: 16px;
    }
    .elder-title {
      font-size: 16px;
      font-weight: 800;
      color: var(--accent);
      margin-bottom: 6px;
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .elder-desc { font-size: 13px; color: var(--text-sub); line-height: 1.5; margin-bottom: 14px; }
    .voice-read-btn {
      background: #FFF;
      border: 1px solid #FDBA74;
      color: var(--accent);
      padding: 6px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 700;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 4px;
      margin-bottom: 12px;
    }

    .pin-input {
      height: 56px;
      font-size: 26px;
      font-weight: 800;
      text-align: center;
      letter-spacing: 12px;
      background: #FFF;
      border: 2px solid #FDBA74;
    }
    .pin-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(194, 65, 12, 0.2);
    }

    /* 提交行动按键 */
    .submit-btn {
      width: 100%;
      height: 52px;
      border-radius: var(--radius-btn);
      background: linear-gradient(135deg, var(--accent) 0%, #EA580C 100%);
      color: white;
      font-size: 16px;
      font-weight: 800;
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      box-shadow: 0 6px 18px rgba(194, 65, 12, 0.25);
      transition: all 0.2s;
      margin-top: 8px;
    }
    .submit-btn:active { transform: scale(0.98); }
    .submit-btn.kids {
      background: linear-gradient(135deg, var(--kids-blue) 0%, #0284C7 100%);
      box-shadow: 0 6px 18px rgba(2, 132, 199, 0.25);
    }

    .token-badge {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      font-size: 12px;
      color: var(--success);
      margin-top: 14px;
      background: var(--success-soft);
      padding: 6px 12px;
      border-radius: 12px;
      border: 1px solid #A7F3D0;
    }

    /* 右上角管理员快捷登录角标 */
    .admin-link {
      position: absolute;
      top: 18px;
      right: 20px;
      font-size: 12px;
      color: var(--text-muted);
      text-decoration: none;
      display: flex;
      align-items: center;
      gap: 4px;
      padding: 4px 8px;
      border-radius: 8px;
      border: 1px solid var(--border-subtle);
    }
    .admin-link:hover { color: var(--text-main); border-color: var(--text-sub); }

    /* Toast 通知 */
    #toast {
      position: fixed;
      top: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: #1C1917;
      color: #FFF;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 13px;
      font-weight: 600;
      display: none;
      box-shadow: 0 6px 20px rgba(0,0,0,0.25);
      z-index: 1000;
    }
  </style>
</head>
<body>

  <div class="auth-container">
    <a href="admin.html" class="admin-link">🛠️ 平台管理</a>

    <div class="brand-header">
      <div class="brand-logo">伴</div>
      <div class="brand-title">伴暖 WarmCompanion</div>
      <div class="brand-sub">一老一小双模家庭温情陪伴平台</div>
    </div>

    <!-- 顶层主通道切换 -->
    <div class="role-nav">
      <button class="role-tab active" id="tabElderChild" onclick="switchMainChannel('elder_child')">
        👵/👶 长辈与儿童极速入家
      </button>
      <button class="role-tab" id="tabGuardian" onclick="switchMainChannel('guardian')">
        🏡 守护者通道
      </button>
    </div>

    <!-- ================= 👵/👶 通道 A：长辈与儿童专属免密入家 ================= -->
    <div id="channelElderChild">
      <div class="elder-box">
        <div class="elder-title"><span>👵</span> <span>老人与小孩快速回家</span></div>
        <div class="elder-desc">无需记复杂账号密码！输入家里给您设置的【家庭码】与【个人 Pin 码】即可免密直达。</div>
        <button class="voice-read-btn" onclick="speakGuide()">🔊 听语音操作指引</button>

        <div class="form-group">
          <label class="form-label">家庭邀请码 (6 位大写)</label>
          <input type="text" id="memberInviteCode" value="HAPPY8" placeholder="例如：HAPPY8" style="text-transform:uppercase; font-weight:700;">
        </div>

        <div class="form-group">
          <label class="form-label">个人专属 Pin 码 (4~6 位数字)</label>
          <input type="password" id="memberPinCode" class="pin-input" value="8888" placeholder="••••" maxlength="6">
          <div style="font-size:11px; color:var(--text-muted); margin-top:4px;">预设演示：外婆 Pin 码为 8888，豆豆 Pin 码为 6666</div>
        </div>
      </div>

      <button class="submit-btn" onclick="submitMemberLogin()">
        <span>🚀</span> <span>免密极速进入主页</span>
      </button>
    </div>

    <!-- ================= 🏡 通道 B：守护者登录与注册 ================= -->
    <div id="channelGuardian" style="display:none;">
      <div class="sub-switch">
        <button class="sub-btn active" id="subBtnLogin" onclick="switchGuardianSub('login')">守护者登录</button>
        <button class="sub-btn" id="subBtnRegister" onclick="switchGuardianSub('register')">创建家庭空间</button>
      </div>

      <!-- 守护者登录表单 -->
      <form id="formGuardianLogin" onsubmit="event.preventDefault(); submitGuardianLogin();">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" id="loginPhone" value="13800138000" placeholder="请输入11位手机号" maxlength="11">
        </div>
        <div class="form-group">
          <label class="form-label">登录密码</label>
          <input type="password" id="loginPassword" value="Password123!" placeholder="请输入密码">
        </div>
        <button type="submit" class="submit-btn">
          <span>🔐</span> <span>登 录</span>
        </button>
      </form>

      <!-- 守护者注册表单 -->
      <form id="formGuardianRegister" style="display:none;" onsubmit="event.preventDefault(); submitGuardianRegister();">
        <div class="form-group">
          <label class="form-label">手机号</label>
          <input type="tel" id="regPhone" placeholder="请输入11位手机号" maxlength="11">
        </div>
        <div class="form-group">
          <label class="form-label">登录密码</label>
          <input type="password" id="regPassword" placeholder="设置6位以上密码">
        </div>
        <div class="form-group">
          <label class="form-label">家庭空间名称</label>
          <input type="text" id="regFamilyName" placeholder="例如：常青温馨一家">
        </div>
        <div class="form-group">
          <label class="form-label">您的称呼</label>
          <input type="text" id="regNickname" placeholder="例如：女儿小敏">
        </div>
        <div class="form-group">
          <label class="form-label">出生年月日 (用于智能适老测算)</label>
          <input type="date" id="regBirthDate" value="1992-05-15">
        </div>
        <button type="submit" class="submit-btn">
          <span>✨</span> <span>创建家庭并进入</span>
        </button>
      </form>
    </div>

    <!-- Sa-Token 30 天持久会话保障标识 -->
    <div class="token-badge">
      <span>🛡️</span> <span>Sa-Token 协议驱动 · 30天持久免登会话保障 (2,592,000s)</span>
    </div>
  </div>

  <div id="toast">提示信息</div>

  <script>
    function showToast(msg) {
      const t = document.getElementById('toast');
      t.innerText = msg;
      t.style.display = 'block';
      setTimeout(() => { t.style.display = 'none'; }, 3000);
    }

    function speakGuide() {
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const u = new SpeechSynthesisUtterance("外婆或者宝贝，输入咱们家里的六位大写字母，再加上您的四位小数字，点击大按钮就能马上进门啦！");
        u.lang = 'zh-CN';
        u.rate = 0.85;
        window.speechSynthesis.speak(u);
      } else {
        showToast("您的设备暂不支持语音朗读");
      }
    }

    function switchMainChannel(type) {
      if (type === 'elder_child') {
        document.getElementById('channelElderChild').style.display = 'block';
        document.getElementById('channelGuardian').style.display = 'none';
        document.getElementById('tabElderChild').classList.add('active');
        document.getElementById('tabGuardian').classList.remove('active');
      } else {
        document.getElementById('channelElderChild').style.display = 'none';
        document.getElementById('channelGuardian').style.display = 'block';
        document.getElementById('tabElderChild').classList.remove('active');
        document.getElementById('tabGuardian').classList.add('active');
      }
    }

    function switchGuardianSub(subType) {
      if (subType === 'login') {
        document.getElementById('formGuardianLogin').style.display = 'block';
        document.getElementById('formGuardianRegister').style.display = 'none';
        document.getElementById('subBtnLogin').classList.add('active');
        document.getElementById('subBtnRegister').classList.remove('active');
      } else {
        document.getElementById('formGuardianLogin').style.display = 'none';
        document.getElementById('formGuardianRegister').style.display = 'block';
        document.getElementById('subBtnLogin').classList.remove('active');
        document.getElementById('subBtnRegister').classList.add('active');
      }
    }

    // 保存 30 天 Sa-Token 会话
    function saveSessionAndRedirect(token, user) {
      localStorage.setItem('satoken', token);
      localStorage.setItem('satoken_user', JSON.stringify(user));
      showToast("✅ 登录成功！30天持久免登已激活，正在进入伴暖空间...");
      setTimeout(() => {
        window.location.href = 'index.html';
      }, 1000);
    }

    // 1. 长辈/儿童 Pin 码免密入家
    function submitMemberLogin() {
      const inviteCode = document.getElementById('memberInviteCode').value.trim().toUpperCase();
      const pinCode = document.getElementById('memberPinCode').value.trim();

      if (!inviteCode || !pinCode) {
        showToast("⚠️ 请完整填写家庭码和专属 Pin 码");
        return;
      }

      // 演示状态自适应（外婆 8888，豆豆 6666）
      let role = 'elder';
      let name = '外婆';
      let birth = '1958-06-18';

      if (pinCode === '6666') {
        role = 'child';
        name = '豆豆';
        birth = '2019-09-01';
      }

      const mockToken = "satoken_" + btoa(JSON.stringify({ sub: "usr_" + role, fam: inviteCode, role: role, exp: Date.now() + 86400 * 30 * 1000 }));
      const user = { user_id: "usr_" + role, family_id: "fam_" + inviteCode, role: role, nickname: name, birth_date: birth };

      saveSessionAndRedirect(mockToken, user);
    }

    // 2. 守护者密码登录
    function submitGuardianLogin() {
      const phone = document.getElementById('loginPhone').value.trim();
      const pass = document.getElementById('loginPassword').value.trim();

      if (!phone || !pass) {
        showToast("⚠️ 请输入手机号与密码");
        return;
      }

      const mockToken = "satoken_" + btoa(JSON.stringify({ sub: "usr_guardian", fam: "fam_demo", role: "guardian", exp: Date.now() + 86400 * 30 * 1000 }));
      const user = { user_id: "usr_guardian", family_id: "fam_demo", role: "guardian", nickname: "女儿小敏", birth_date: "1992-05-15" };

      saveSessionAndRedirect(mockToken, user);
    }

    // 3. 守护者建家注册
    function submitGuardianRegister() {
      const phone = document.getElementById('regPhone').value.trim();
      const pass = document.getElementById('regPassword').value.trim();
      const famName = document.getElementById('regFamilyName').value.trim();
      const nickname = document.getElementById('regNickname').value.trim();
      const birth = document.getElementById('regBirthDate').value;

      if (!phone || !pass || !famName || !nickname) {
        showToast("⚠️ 请将注册信息填写完整");
        return;
      }

      const mockToken = "satoken_" + btoa(JSON.stringify({ sub: "usr_new_guardian", fam: "fam_new", role: "guardian", exp: Date.now() + 86400 * 30 * 1000 }));
      const user = { user_id: "usr_new_guardian", family_id: "fam_new", role: "guardian", nickname: nickname, birth_date: birth };

      saveSessionAndRedirect(mockToken, user);
    }
  </script>
</body>
</html>
